<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Fondo Índigo Studio -->
    <linearGradient id="bgIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1a4b" />
      <stop offset="100%" stop-color="#14133a" />
    </linearGradient>

    <!-- 1. Bloque Amarillo / Naranja (UparTrivia) -->
    <linearGradient id="yTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7be38" />
      <stop offset="100%" stop-color="#ffd043" />
    </linearGradient>
    <linearGradient id="yLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fa9d1b" />
      <stop offset="100%" stop-color="#fbab22" />
    </linearGradient>
    <linearGradient id="yRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c0b" />
      <stop offset="100%" stop-color="#f37805" />
    </linearGradient>

    <!-- 2. Bloque Azul (UparPuzzle) -->
    <linearGradient id="bTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec6fa" />
      <stop offset="100%" stop-color="#7cd4fd" />
    </linearGradient>
    <linearGradient id="bLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3db4fc" />
      <stop offset="100%" stop-color="#4ec0fe" />
    </linearGradient>
    <linearGradient id="bRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d8cf0" />
      <stop offset="100%" stop-color="#1578dc" />
    </linearGradient>

    <!-- 3. Bloque Verde (UparWheel) -->
    <linearGradient id="gLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15c377" />
      <stop offset="100%" stop-color="#1dd082" />
    </linearGradient>
    <linearGradient id="gTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ce297" />
      <stop offset="100%" stop-color="#52eba3" />
    </linearGradient>
    <linearGradient id="gRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#049b63" />
      <stop offset="100%" stop-color="#038c5a" />
    </linearGradient>

    <!-- 4. Bloque Rosa / Carmesí (UparGrade) -->
    <linearGradient id="pTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85c80" />
      <stop offset="100%" stop-color="#ff698b" />
    </linearGradient>
    <linearGradient id="pLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f93864" />
      <stop offset="100%" stop-color="#ee1b4b" />
    </linearGradient>
    <linearGradient id="pRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df0f41" />
      <stop offset="100%" stop-color="#ce0b3a" />
    </linearGradient>

    <!-- Sombra suave de piso para dar profundidad 3D -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07071c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fondo Índigo Oscuro -->
  <rect width="1024" height="1024" fill="url(#bgIndigo)" />

  <!-- Figura Isométrica Principal "U" -->
  <g filter="url(#dropShadow)" stroke-linejoin="round" stroke-linecap="round">

    <!-- ==================== BLOQUE VERDE (INFERIOR DERECHO) ==================== -->
    <!-- Cara interior izquierda (vertical) -->
    <polygon points="568,464 677,527 677,619 568,556" fill="url(#gLeft)" />
    <!-- Cara interior superior (escalón horizontal) -->
    <polygon points="514,587 568,556 677,619 620,652" fill="url(#gTop)" />
    <!-- Cara exterior derecha (en L invertida) -->
    <polygon points="620,652 677,619 677,527 782,466 782,673 620,767" fill="url(#gRight)" />

    <!-- ==================== BLOQUE AZUL (SUPERIOR DERECHO) ==================== -->
    <!-- Tapa superior -->
    <polygon points="673,253 782,316 677,377 568,314" fill="url(#bTop)" />
    <!-- Cara izquierda -->
    <polygon points="568,314 677,377 677,527 568,464" fill="url(#bLeft)" />
    <!-- Cara derecha -->
    <polygon points="677,377 782,316 782,466 677,527" fill="url(#bRight)" />

    <!-- ==================== BLOQUE AMARILLO/NARANJA (SUPERIOR IZQUIERDO) ==================== -->
    <!-- Tapa superior -->
    <polygon points="352,253 457,314 346,377 242,316" fill="url(#yTop)" />
    <!-- Cara izquierda (mitad superior) -->
    <polygon points="242,316 346,377 346,527 242,466" fill="url(#yLeft)" />
    <!-- Cara interior derecha (completa hasta el pliegue rosa) -->
    <polygon points="346,377 457,314 457,556 346,619" fill="url(#yRight)" />

    <!-- ==================== BLOQUE ROSA/ROJO (BASE EN L IZQUIERDA) ==================== -->
    <!-- Rampa / Tapa superior rosa -->
    <polygon points="346,619 457,556 620,652 511,715" fill="url(#pTop)" />
    <!-- Cara frontal izquierda en L -->
    <polygon points="242,466 346,527 346,619 511,715 511,829 242,673" fill="url(#pLeft)" />
    <!-- Cara frontal derecha inferior -->
    <polygon points="511,715 620,652 620,767 511,829" fill="url(#pRight)" />

    <!-- ==================== BISELES DE LUZ (ARISTAS 3D FIELES AL ORIGINAL) ==================== -->
    <!-- Aristas iluminadas del bloque amarillo -->
    <polyline points="242,316 346,377 457,314" fill="none" stroke="#ffe47a" stroke-width="2.5" opacity="0.85" />
    <line x1="346" y1="377" x2="346" y2="619" stroke="#ffae42" stroke-width="2" opacity="0.65" />

    <!-- Aristas iluminadas del bloque azul -->
    <polyline points="568,314 677,377 782,316" fill="none" stroke="#aee6ff" stroke-width="2.5" opacity="0.85" />
    <line x1="677" y1="377" x2="677" y2="619" stroke="#6fd2ff" stroke-width="2" opacity="0.6" />

    <!-- Aristas iluminadas del bloque verde -->
    <line x1="568" y1="556" x2="677" y2="619" stroke="#7bf5be" stroke-width="2" opacity="0.7" />
    <line x1="620" y1="652" x2="677" y2="619" stroke="#82f7c3" stroke-width="2.5" opacity="0.8" />

    <!-- Aristas iluminadas del bloque rosa -->
    <polyline points="346,619 511,715 620,652" fill="none" stroke="#ff9bb3" stroke-width="3" opacity="0.85" />
    <line x1="511" y1="715" x2="511" y2="829" stroke="#ff7597" stroke-width="2" opacity="0.55" />
    <line x1="346" y1="619" x2="457" y2="556" stroke="#ff8da8" stroke-width="2" opacity="0.5" />
  </g>
</svg>